name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version
        id: version
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tagRefPrefix = 'refs/tags/';
            if (context.ref.startsWith(tagRefPrefix)) {
              const tag = context.ref.substring(tagRefPrefix.length);
              const version = tag.startsWith('v') ? tag.substring(1) : tag;
              const buildNumber = version.split('.').pop() ?? '';
              core.setOutput('version', version);
              core.setOutput('tag', tag);
              core.setOutput('build_number', buildNumber);
              return { version, tag, build_number: buildNumber };
            }

            let latestVersion = '0.0.0';
            try {
              const latestRelease = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              const latestTag = latestRelease.data.tag_name ?? '';
              if (latestTag) {
                latestVersion = latestTag.startsWith('v') ? latestTag.slice(1) : latestTag;
              }
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            const parts = latestVersion.split('.').map((part) => Number.parseInt(part, 10) || 0);
            while (parts.length < 3) {
              parts.push(0);
            }
            parts[2] += 1;
            const version = parts.join('.');
            const tag = `v${version}`;
            const buildNumber = String(parts[2]);
            core.setOutput('version', version);
            core.setOutput('tag', tag);
            core.setOutput('build_number', buildNumber);
            return { version, tag, build_number: buildNumber };

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare signing configuration
        run: |
          cp key "app/REDACTED"
          cat <<'PROP' > local.properties
          keystore.file=REDACTED
          keystore.password=REDACTED
          keystore.keyalias=REDACTED
          keystore.keypassword=REDACTED
          PROP

      - name: Assemble release APK
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          VERSION_NAME: ${{ steps.version.outputs.version }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/release/com.apkupdater-release.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: app/build/outputs/apk/release/com.apkupdater-release.apk
          draft: false
          prerelease: false
          make_latest: true
