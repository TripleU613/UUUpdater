name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '17'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Public releases ship the standard flavor only. The techeaz flavor embeds a
      # private-feed token and must never be published from this repository.
      - name: Select release channel
        id: channel
        run: |
          echo "tag_prefix=" >> "$GITHUB_OUTPUT"
          echo "name_prefix=Public Release" >> "$GITHUB_OUTPUT"
          echo "artifact_prefix=public" >> "$GITHUB_OUTPUT"
          echo "make_latest=true" >> "$GITHUB_OUTPUT"

      - name: Determine release version
        id: version
        uses: actions/github-script@v7
        env:
          RELEASE_TAG_PREFIX: ${{ steps.channel.outputs.tag_prefix }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prefix = process.env.RELEASE_TAG_PREFIX ?? '';
            const tagRefPrefix = 'refs/tags/';

            const stripPrefix = (tag) => {
              if (prefix && tag.startsWith(prefix)) {
                return tag.substring(prefix.length);
              }
              return tag;
            };

            const parseVersion = (tag) => {
              const stripped = stripPrefix(tag);
              return stripped.startsWith('v') ? stripped.substring(1) : stripped;
            };

            const toParts = (version) => version.split('.').map((part) => Number.parseInt(part, 10) || 0);

            const compareVersions = (a, b) => {
              const partsA = toParts(a);
              const partsB = toParts(b);
              const length = Math.max(partsA.length, partsB.length);
              for (let i = 0; i < length; i += 1) {
                const diff = (partsA[i] || 0) - (partsB[i] || 0);
                if (diff !== 0) {
                  return diff;
                }
              }
              return 0;
            };

            if (context.ref.startsWith(tagRefPrefix)) {
              const fullTag = context.ref.substring(tagRefPrefix.length);
              const version = parseVersion(fullTag);
              const buildNumber = version.split('.').pop() ?? '';
              core.setOutput('version', version);
              core.setOutput('tag', fullTag);
              core.setOutput('build_number', buildNumber);
              return { version, tag: fullTag, build_number: buildNumber };
            }

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );

            // Tags are considered too, so a fresh repo keeps counting from pushed tags.
            const tags = await github.paginate(
              github.rest.repos.listTags,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 },
            );
            const tagNames = [
              ...releases.map((release) => release.tag_name ?? ''),
              ...tags.map((t) => t.name ?? ''),
            ];

            let latestVersion = '0.0.0';
            for (const tagName of tagNames) {
              if (!tagName) {
                continue;
              }
              if (prefix && !tagName.startsWith(prefix)) {
                continue;
              }
              if (!prefix && !tagName.startsWith('v')) {
                continue;
              }
              const version = parseVersion(tagName);
              if (!version) {
                continue;
              }
              if (compareVersions(version, latestVersion) > 0) {
                latestVersion = version;
              }
            }

            const parts = toParts(latestVersion);
            while (parts.length < 3) {
              parts.push(0);
            }
            parts[2] += 1;
            const version = parts.join('.');
            const tag = `${prefix}v${version}`;
            const buildNumber = String(parts[2]);
            core.setOutput('version', version);
            core.setOutput('tag', tag);
            core.setOutput('build_number', buildNumber);
            return { version, tag, build_number: buildNumber };

      - name: Create tag for new release
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = '${{ steps.version.outputs.tag }}';
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
            }

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Assemble release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STANDARD_FEED_TOKEN: ${{ secrets.STANDARD_FEED_TOKEN }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          VERSION_NAME: ${{ steps.version.outputs.version }}
        run: ./gradlew --no-daemon assembleStandardRelease

      - name: Upload standard release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.channel.outputs.artifact_prefix }}-standard-apk-${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/standard/release/*.apk

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.channel.outputs.name_prefix }} ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            app/build/outputs/apk/standard/release/*.apk
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          make_latest: ${{ steps.channel.outputs.make_latest }}
