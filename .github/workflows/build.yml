name: Build

on:
  push:
    branches: ['3.x']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # GitHub-hosted only: never run untrusted PR code on self-hosted runners.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Assemble debug APKs
        run: ./gradlew --no-daemon assembleStandardDebug assembleTecheazDebug
