name: Techeaz Release

on:
  push:
    tags:
      - 'techeaz-v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG_PREFIX: techeaz-
  RELEASE_NAME_PREFIX: Techeaz Release

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version
        id: version
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prefix = process.env.RELEASE_TAG_PREFIX ?? '';
            const tagRefPrefix = 'refs/tags/';

            const stripPrefix = (tag) => {
              if (prefix && tag.startsWith(prefix)) {
                return tag.substring(prefix.length);
              }
              return tag;
            };

            const parseVersion = (tag) => {
              const stripped = stripPrefix(tag);
              return stripped.startsWith('v') ? stripped.substring(1) : stripped;
            };

            const toParts = (version) => version.split('.').map((part) => Number.parseInt(part, 10) || 0);

            const compareVersions = (a, b) => {
              const partsA = toParts(a);
              const partsB = toParts(b);
              const length = Math.max(partsA.length, partsB.length);
              for (let i = 0; i < length; i += 1) {
                const diff = (partsA[i] || 0) - (partsB[i] || 0);
                if (diff !== 0) {
                  return diff;
                }
              }
              return 0;
            };

            if (context.ref.startsWith(tagRefPrefix)) {
              const fullTag = context.ref.substring(tagRefPrefix.length);
              const version = parseVersion(fullTag);
              const buildNumber = version.split('.').pop() ?? '';
              core.setOutput('version', version);
              core.setOutput('tag', fullTag);
              core.setOutput('build_number', buildNumber);
              return { version, tag: fullTag, build_number: buildNumber };
            }

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );

            let latestVersion = '0.0.0';
            for (const release of releases) {
              const tagName = release.tag_name ?? '';
              if (!tagName) {
                continue;
              }
              if (prefix && !tagName.startsWith(prefix)) {
                continue;
              }
              if (!prefix && !tagName.startsWith('v')) {
                continue;
              }
              const version = parseVersion(tagName);
              if (!version) {
                continue;
              }
              if (compareVersions(version, latestVersion) > 0) {
                latestVersion = version;
              }
            }

            const parts = toParts(latestVersion);
            while (parts.length < 3) {
              parts.push(0);
            }
            parts[2] += 1;
            const version = parts.join('.');
            const tag = `${prefix}v${version}`;
            const buildNumber = String(parts[2]);
            core.setOutput('version', version);
            core.setOutput('tag', tag);
            core.setOutput('build_number', buildNumber);
            return { version, tag, build_number: buildNumber };

      - name: Create tag for new release
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = '${{ steps.version.outputs.tag }}';
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
            }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare signing configuration
        run: |
          cp key "app/REDACTED"
          cat <<'PROP' > local.properties
          keystore.file=REDACTED
          keystore.password=REDACTED
          keystore.keyalias=REDACTED
          keystore.keypassword=REDACTED
          PROP

      - name: Assemble release APKs
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          VERSION_NAME: ${{ steps.version.outputs.version }}
        run: ./gradlew --no-daemon assembleStandardRelease assembleTecheazRelease

      - name: Upload standard release APK
        uses: actions/upload-artifact@v4
        with:
          name: techeaz-standard-apk-${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/standard/release/com.tripleu.updater-standard-release.apk

      - name: Upload techeaz release APK
        uses: actions/upload-artifact@v4
        with:
          name: techeaz-techeaz-apk-${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/techeaz/release/com.tripleu.updater-techeaz-release.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ env.RELEASE_NAME_PREFIX }} ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            app/build/outputs/apk/standard/release/com.tripleu.updater-standard-release.apk
            app/build/outputs/apk/techeaz/release/com.tripleu.updater-techeaz-release.apk
          draft: false
          prerelease: false
          make_latest: false
